[package]
name = "novapdf-engine"
description = "NovaPdf engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
novapdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
novapdf-render = { workspace = true }
novapdf-cos = { workspace = true }
novapdf-organize = { workspace = true }
novapdf-annot = { workspace = true }
novapdf-forms = { workspace = true }
novapdf-xfa = { workspace = true }
novapdf-edit = { workspace = true }
novapdf-audit = { workspace = true }
novapdf-redact = { workspace = true }
novapdf-print = { workspace = true }
novapdf-xfdf = { workspace = true }
novapdf-sign = { workspace = true }
novapdf-optimize = { workspace = true }
novapdf-a11y = { workspace = true }
novapdf-ocr = { workspace = true }
novapdf-js = { workspace = true }
novapdf-compare = { workspace = true }
novapdf-preflight = { workspace = true }
novapdf-export = { workspace = true }
novapdf-fonts = { workspace = true }
novapdf-create = { workspace = true }
novapdf-model = { workspace = true }
novapdf-geom = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
png = "0.18"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today").
chrono = { version = "0.4", default-features = false, features = ["clock"] }
